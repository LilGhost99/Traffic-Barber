<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mis citas</title>
<meta name="theme-color" content="#050505">
<link rel="apple-touch-icon" href="apple-touch-icon-citas.png?v=1">
<link rel="icon" type="image/png" href="apple-touch-icon-citas.png?v=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mis citas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="colores.css?v=11">
<style>
:root{--bg:#050505;--surf:#111;--line:#232323;--text:#F5F5F5;--muted:#9A9A9A;--amber:#FFB020;--hora:84px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Barlow',sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit}
.hidden{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}

/* Arriba */
.top{position:sticky;top:0;z-index:5;background:linear-gradient(var(--bg) 85%,transparent);padding:14px 0 8px}
.fila{display:flex;align-items:center;gap:10px}
.titulo{flex:1;min-width:0}
.titulo small{display:block;font-size:14px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.titulo h1{margin:2px 0 0;font:800 34px/1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.01em}
.flecha{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surf);font-size:22px;cursor:pointer;display:grid;place-items:center}
.btn-hoy{height:46px;padding:0 16px;border-radius:999px;border:0;background:var(--gold);color:#050505;font-weight:700;cursor:pointer}

/* Tira de días */
.dias{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.dias::-webkit-scrollbar{display:none}
.dia{flex:0 0 54px;border:1px solid var(--line);background:var(--surf);border-radius:14px;padding:8px 0 7px;text-align:center;cursor:pointer;position:relative}
.dia span{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase}
.dia b{display:block;font:800 22px/1.1 'Barlow Condensed',sans-serif}
.dia i{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--gold);color:#050505;font:700 12px/20px 'Barlow',sans-serif;font-style:normal;padding:0 5px}
.dia i.pend{background:var(--amber)}
.dia[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:#050505}
.dia[aria-pressed="true"] span{color:#050505}
.dia[aria-pressed="true"] i{background:#050505;color:var(--gold)}
.dia.cerrado b{opacity:.4}

/* Resumen */
.resumen{margin:10px 0 4px;font-size:17px;color:var(--muted)}
.resumen b{color:var(--text)}
.alerta{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;padding:12px 14px;border-radius:14px;border:1px solid rgba(255,176,32,.5);background:rgba(255,176,32,.1);color:#FFD27A;font-size:16px;font-weight:600;text-align:left;cursor:pointer}
.alerta::after{content:"›";margin-left:auto;font-size:22px}

/* Cuadrícula */
.grid{position:relative;margin-top:14px}
.hr{position:relative;height:var(--hora);border-top:1px solid var(--line)}
.hr::after{content:"";position:absolute;left:58px;right:0;top:50%;border-top:1px dashed #1B1B1B}
.hr span{position:absolute;top:-10px;left:0;width:50px;background:var(--bg);font-size:14px;font-weight:600;color:var(--muted)}
.capa{position:absolute;inset:0 0 0 62px}
.cita{position:absolute;border-radius:12px;padding:7px 11px;overflow:hidden;cursor:pointer;text-align:left;border:0;background:rgb(var(--gold-rgb) / .16);border-left:5px solid var(--gold);display:flex;flex-direction:column;justify-content:flex-start}
.cita .h{font-size:13px;font-weight:700;color:var(--gold-hi)}
.cita .n{font:800 20px/1.05 'Barlow Condensed',sans-serif;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cita .s{font-size:14px;color:#CFCFCF;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cita.pendiente{background:rgba(255,176,32,.13);border-left-color:var(--amber)}
.cita.pendiente .h{color:#FFD27A}
.cita.pendiente .h::after{content:" · POR CONFIRMAR"}
.cita.atendida{background:#151515;border-left-color:#3A3A3A;opacity:.6}
.cita.atendida .h::after{content:" · ✓ ATENDIDA"}
.cita.chica{flex-direction:row;align-items:center;gap:8px;padding-top:2px;padding-bottom:2px}
.cita.chica .s{display:none}
.ahora{position:absolute;left:56px;right:0;height:0;border-top:2px solid #FF4D4D;z-index:2;pointer-events:none}
.ahora::before{content:"";position:absolute;left:-5px;top:-6px;width:10px;height:10px;border-radius:50%;background:#FF4D4D}
.vacio{margin-top:40px;text-align:center;color:var(--muted);font-size:18px}
.vacio b{display:block;font:800 30px/1.1 'Barlow Condensed',sans-serif;color:var(--text);text-transform:uppercase;margin-bottom:6px}

/* Detalle */
.velo{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.hoja{width:100%;max-width:560px;background:#121212;border-radius:22px 22px 0 0;border-top:1px solid #2A2A2A;padding:12px 18px calc(20px + env(safe-area-inset-bottom));animation:sube .2s ease-out}
@keyframes sube{from{transform:translateY(40px);opacity:0}}
.asa{width:44px;height:5px;border-radius:3px;background:#333;margin:0 auto 14px}
.hoja .h{font-size:16px;font-weight:700;color:var(--gold)}
.hoja h2{margin:4px 0 2px;font:800 32px/1.05 'Barlow Condensed',sans-serif;text-transform:uppercase}
.hoja .s{font-size:18px;color:#D8D8D8}
.datos{margin:12px 0 4px;display:flex;flex-direction:column;gap:6px;font-size:16px;color:#CFCFCF}
.estado{display:inline-block;margin-top:10px;padding:5px 12px;border-radius:999px;font-size:14px;font-weight:700}
.estado.pendiente{background:rgba(255,176,32,.15);color:#FFD27A}
.estado.confirmada{background:rgb(var(--gold-rgb) / .15);color:var(--gold-hi)}
.estado.atendida{background:#222;color:#BBB}
.acc{display:grid;gap:10px;margin-top:16px}
.acc .dos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.b{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:999px;font-weight:700;font-size:17px;text-decoration:none;border:0;cursor:pointer}
.b.prim{background:var(--gold);color:#050505}
.b.sec{background:transparent;color:var(--text);border:2px solid #3E3E3E}
.b.txt{background:none;color:#E5867A;min-height:44px;font-size:15px}

/* Login */
.login{margin-top:40px}
.login img{width:220px;max-width:70%;display:block;margin:0 auto 24px}
.login label{display:block;font-weight:600;margin-top:14px}
.login input{display:block;width:100%;margin-top:6px;font:inherit;font-size:17px;color:var(--text);background:#0A0A0A;border:1px solid #333;border-radius:12px;padding:13px 14px}
.login .b{width:100%;margin-top:18px}
.aviso{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.45;background:rgba(229,103,90,.12);border:1px solid rgba(229,103,90,.5);color:#F2B1A8}
.aviso.ok{background:rgba(91,194,122,.12);border-color:rgba(91,194,122,.5);color:#B4E6C3}
.link{display:block;margin:12px auto 0;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:15px}
.salir{background:none;border:0;color:var(--muted);font-size:14px;text-decoration:underline;cursor:pointer;display:block;margin:30px auto 0}
</style>
</head>
<body>
<div class="wrap">

  <!-- Entrar -->
  <section id="vLogin" class="login hidden">
    <img src="logo.png" alt="Traffic Barber">
    <form id="fLogin">
      <label>Correo<input id="correo" type="email" autocomplete="username" required></label>
      <label>Contraseña<input id="clave" type="password" autocomplete="current-password" required></label>
      <button class="b prim" type="submit" id="bEntrar">Entrar</button>
    </form>
    <button class="b sec hidden" type="button" id="bGoogle" style="width:100%;margin-top:12px">Entrar con Google</button>
    <button class="link" type="button" id="bClave">Crear o recuperar contraseña</button>
    <div id="eLogin" class="aviso hidden" role="alert"></div>
  </section>

  <!-- Citas -->
  <section id="vCitas" class="hidden">
    <div class="top">
      <div class="fila">
        <button class="flecha" type="button" id="bAntes" aria-label="Día anterior">‹</button>
        <div class="titulo"><small id="tSub"></small><h1 id="tDia"></h1></div>
        <button class="btn-hoy hidden" type="button" id="bHoy">Hoy</button>
        <button class="flecha" type="button" id="bDespues" aria-label="Día siguiente">›</button>
      </div>
      <div class="dias" id="dias"></div>
    </div>
    <div class="resumen" id="resumen"></div>
    <button class="alerta hidden" type="button" id="alerta"></button>
    <div id="vacio" class="vacio hidden"></div>
    <div class="grid" id="grid"></div>
    <button class="salir" type="button" id="bSalir">Cerrar sesión</button>
  </section>
</div>

<div class="velo hidden" id="velo"><div class="hoja" id="hoja" role="dialog" aria-modal="true"></div></div>

<script type="module">
import { db, auth, configurado, escapar, diaDe, durDe } from "./firebase.js";
import { NEGOCIO } from "./firebase-config.js";
import { signInWithEmailAndPassword, onAuthStateChanged, signOut, GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, doc, getDoc, query, where, onSnapshot, updateDoc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = id => document.getElementById(id);
const DIAS = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
const MES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const fechaISO = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const deISO = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const aMin = h => { const [a, b] = (h || "0:0").split(":").map(Number); return a * 60 + b; };
const hora12 = h => { const m = aMin(h), hh = Math.floor(m / 60), mm = m % 60; return `${((hh + 11) % 12) + 1}:${String(mm).padStart(2, "0")} ${hh < 12 ? "am" : "pm"}`; };
const horaCorta = m => `${((Math.floor(m / 60) + 11) % 12) + 1} ${m < 720 ? "am" : "pm"}`;
const minDe = c => c.min || durDe(NEGOCIO, c.servicioId);
const waNum = t => (String(t).length === 11 ? t : "52" + t);
const folioDe = id => "TB-" + id.slice(0, 5).toUpperCase();
const VISIBLES = ["pendiente", "confirmada", "atendida"];

let citas = [], agenda = null, dia = fechaISO(new Date()), abierta = null;

// ---------- Entrar ----------
function aviso(txt, ok = false) { const a = $("eLogin"); a.className = "aviso" + (ok ? " ok" : ""); a.textContent = txt; }
$("bGoogle").classList.remove("hidden");
$("fLogin").addEventListener("submit", async e => {
  e.preventDefault(); $("bEntrar").disabled = true;
  try { await signInWithEmailAndPassword(auth, $("correo").value.trim(), $("clave").value); }
  catch (ex) { console.error(ex); aviso("Correo o contraseña incorrectos."); }
  $("bEntrar").disabled = false;
});
$("bGoogle").addEventListener("click", async () => {
  try { await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch (ex) { console.error(ex); if (ex.code !== "auth/popup-closed-by-user") aviso(`No se pudo entrar con Google (${ex.code || "error"}). Usa correo y contraseña.`); }
});
$("bClave").addEventListener("click", async () => {
  const correo = $("correo").value.trim();
  if (!correo) { aviso("Escribe tu correo arriba y vuelve a tocar aquí."); $("correo").focus(); return; }
  try { await sendPasswordResetEmail(auth, correo); aviso("Te mandamos un correo para poner tu contraseña (revisa spam).", true); }
  catch (ex) { console.error(ex); aviso("No se pudo mandar el correo. Revisa que esté bien escrito."); }
});
$("bSalir").addEventListener("click", () => signOut(auth));

// ---------- Datos ----------
function escuchar() {
  const desde = new Date(); desde.setDate(desde.getDate() - 14);
  onSnapshot(query(collection(db, "citas"), where("fecha", ">=", fechaISO(desde))), snap => {
    citas = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(c => VISIBLES.includes(c.estado));
    pintar();
    if (abierta) { const c = citas.find(x => x.id === abierta); c ? abrir(c) : cerrar(); }
  }, ex => { console.error(ex); $("resumen").textContent = "No se pudieron cargar las citas."; });
  onSnapshot(doc(db, "config", "agenda"), s => { agenda = s.exists() ? s.data() : null; pintar(); }, () => {});
}
const delDia = f => citas.filter(c => c.fecha === f).sort((a, b) => a.hora.localeCompare(b.hora));

// ---------- Pintar ----------
function pintar() {
  const hoy = fechaISO(new Date()), d = deISO(dia);
  const man = new Date(); man.setDate(man.getDate() + 1);
  $("tSub").textContent = dia === hoy ? "Hoy" : dia === fechaISO(man) ? "Mañana" : DIAS[d.getDay()];
  $("tDia").textContent = `${dia === hoy || dia === fechaISO(man) ? DIAS[d.getDay()] + " " : ""}${d.getDate()} ${MES[d.getMonth()]}`;
  $("bHoy").classList.toggle("hidden", dia === hoy);

  // Tira: ayer + 13 días
  const tira = [];
  for (let i = -1; i < 13; i++) { const x = new Date(); x.setDate(x.getDate() + i); tira.push(fechaISO(x)); }
  if (!tira.includes(dia)) tira.unshift(dia);
  $("dias").innerHTML = tira.map(f => {
    const x = deISO(f), lista = delDia(f).filter(c => c.estado !== "atendida" || f === hoy);
    const pend = lista.some(c => c.estado === "pendiente");
    const cerrado = !diaDe(agenda, NEGOCIO, f).abierto;
    return `<button class="dia${cerrado ? " cerrado" : ""}" type="button" data-f="${f}" aria-pressed="${f === dia}">
      <span>${f === hoy ? "Hoy" : DIAS[x.getDay()].slice(0, 3)}</span><b>${x.getDate()}</b>${lista.length ? `<i class="${pend ? "pend" : ""}">${lista.length}</i>` : ""}</button>`;
  }).join("");
  $("dias").querySelector('[aria-pressed="true"]')?.scrollIntoView({ inline: "center", block: "nearest" });

  // Resumen + aviso de pendientes (cualquier día que viene)
  const lista = delDia(dia), info = diaDe(agenda, NEGOCIO, dia);
  const pend = lista.filter(c => c.estado === "pendiente").length;
  $("resumen").innerHTML = lista.length
    ? `<b>${lista.length} ${lista.length === 1 ? "cita" : "citas"}</b>${pend ? ` · ${pend} por confirmar` : ""}${info.abierto ? ` · abre ${hora12(info.abre)}` : ""}`
    : "";
  const porConfirmar = citas.filter(c => c.estado === "pendiente" && c.fecha >= hoy && c.fecha !== dia).sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));
  $("alerta").classList.toggle("hidden", !porConfirmar.length);
  if (porConfirmar.length) { $("alerta").textContent = `⏳ ${porConfirmar.length} ${porConfirmar.length === 1 ? "cita nueva" : "citas nuevas"} por confirmar en otros días`; $("alerta").dataset.f = porConfirmar[0].fecha; }

  // Día vacío
  $("vacio").classList.toggle("hidden", !!lista.length);
  if (!lista.length) $("vacio").innerHTML = info.abierto ? "<b>Sin citas</b>Día libre por ahora" : "<b>Cerrado</b>Este día no se abre";
  if (!lista.length && !info.abierto) { $("grid").innerHTML = ""; return; }

  // Rango de horas: del horario del día, estirado si hay citas fuera
  let ini = info.abierto ? aMin(info.abre) : 10 * 60, fin = info.abierto ? aMin(info.cierra) + 60 : 20 * 60;
  lista.forEach(c => { ini = Math.min(ini, aMin(c.hora)); fin = Math.max(fin, aMin(c.hora) + minDe(c)); });
  ini = Math.floor(ini / 60) * 60; fin = Math.ceil(fin / 60) * 60;
  const PX = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--hora")) / 60;

  let html = "";
  for (let m = ini; m < fin; m += 60) html += `<div class="hr"><span>${horaCorta(m)}</span></div>`;

  // Carriles por si dos citas se enciman
  const carril = [], fines = [];
  lista.forEach(c => {
    const a = aMin(c.hora); let k = fines.findIndex(f => f <= a);
    if (k < 0) { k = fines.length; fines.push(0); }
    fines[k] = a + minDe(c); carril.push(k);
  });
  const n = Math.max(1, fines.length);
  html += `<div class="capa">` + lista.map((c, i) => {
    const top = (aMin(c.hora) - ini) * PX, alto = Math.max(minDe(c) * PX - 4, 30);
    return `<button class="cita ${c.estado}${alto < 60 ? " chica" : ""}" type="button" data-id="${c.id}"
      style="top:${top + 2}px;height:${alto}px;left:calc(${(100 / n) * carril[i]}% + 2px);width:calc(${100 / n}% - 6px)">
      <span class="h">${hora12(c.hora)}</span><span class="n">${escapar(c.nombre)}</span><span class="s">${escapar(c.servicio)}</span></button>`;
  }).join("") + `</div>`;

  // Línea de "ahora"
  const ahora = new Date(), mAhora = ahora.getHours() * 60 + ahora.getMinutes();
  if (dia === hoy && mAhora >= ini && mAhora <= fin) html += `<div class="ahora" style="top:${(mAhora - ini) * PX}px"></div>`;
  $("grid").innerHTML = html;
}

// ---------- Detalle de una cita ----------
function msgWA(c, tipo) {
  const d = deISO(c.fecha);
  return `https://wa.me/${waNum(c.telefono)}?text=` + encodeURIComponent(
    `Hola ${c.nombre}, ${tipo === "recordar" ? "te recordamos" : "te confirmamos"} tu cita en ${NEGOCIO.nombre}: ` +
    `${c.servicio}, el ${DIAS[d.getDay()].toLowerCase()} ${d.getDate()} de ${MES[d.getMonth()]} a las ${hora12(c.hora)}. ¡Te esperamos! (${folioDe(c.id)})`);
}
function abrir(c) {
  abierta = c.id;
  const d = deISO(c.fecha);
  const datos = [
    `📱 ${escapar(c.telefono)}`,
    c.precio ? `💵 $${c.precio}` : "",
    c.promo ? `🎁 Promo: ${escapar(c.promo)}` : "",
    c.comentario ? `📝 ${escapar(c.comentario)}` : ""
  ].filter(Boolean).map(x => `<div>${x}</div>`).join("");
  const ESTADO = { pendiente: "Nueva · por confirmar", confirmada: "✓ Confirmada", atendida: "✓ Ya se atendió" };
  let acc = "";
  if (c.estado === "pendiente") acc += `<a class="b prim" href="${msgWA(c, "confirmar")}" target="_blank" rel="noopener" data-acc="confirmar">✓ Confirmar y avisar</a>`;
  if (c.estado === "confirmada") acc += `<a class="b sec" href="${msgWA(c, "recordar")}" target="_blank" rel="noopener">Mandar recordatorio</a>`;
  acc += `<div class="dos"><a class="b sec" href="https://wa.me/${waNum(c.telefono)}" target="_blank" rel="noopener">WhatsApp</a><a class="b sec" href="tel:+${waNum(c.telefono)}">Llamar</a></div>`;
  if (c.estado !== "atendida") acc += `<button class="b txt" type="button" data-acc="cancelar">Cancelar cita</button>`;
  acc += `<button class="b sec" type="button" data-acc="cerrar">Cerrar</button>`;
  $("hoja").innerHTML = `<div class="asa"></div>
    <div class="h">${DIAS[d.getDay()]} ${d.getDate()} ${MES[d.getMonth()]} · ${hora12(c.hora)} · ${minDe(c)} min</div>
    <h2>${escapar(c.nombre)}</h2><div class="s">${escapar(c.servicio)}</div>
    <span class="estado ${c.estado}">${ESTADO[c.estado] || c.estado}</span>
    <div class="datos">${datos}</div><div class="acc">${acc}</div>`;
  $("velo").classList.remove("hidden");
}
function cerrar() { abierta = null; $("velo").classList.add("hidden"); }

$("hoja").addEventListener("click", async e => {
  const b = e.target.closest("[data-acc]"); if (!b) return;
  const c = citas.find(x => x.id === abierta); if (!c) return cerrar();
  const cambia = estado => updateDoc(doc(db, "citas", c.id), { estado, actualizado: serverTimestamp(), por: auth.currentUser?.email || "" });
  if (b.dataset.acc === "cerrar") return cerrar();
  if (b.dataset.acc === "confirmar") { cambia("confirmada").catch(ex => { console.error(ex); alert("No se pudo confirmar. Intenta de nuevo."); }); return; }   // el link abre WhatsApp
  if (b.dataset.acc === "cancelar") {
    if (!confirm(`¿Cancelar la cita de ${c.nombre} (${hora12(c.hora)})? La hora queda libre.`)) return;
    try {
      await cambia("cancelada");
      const otra = citas.some(x => x.id !== c.id && x.fecha === c.fecha && x.hora === c.hora && x.estado !== "atendida");
      if (!otra) await deleteDoc(doc(db, "ocupados", `${c.fecha}_${c.hora}`)).catch(() => {});
      cerrar();
    } catch (ex) { console.error(ex); alert("No se pudo cancelar. Intenta de nuevo."); }
  }
});
$("velo").addEventListener("click", e => { if (e.target === $("velo")) cerrar(); });
$("grid").addEventListener("click", e => { const b = e.target.closest(".cita"); if (b) abrir(citas.find(c => c.id === b.dataset.id)); });
$("dias").addEventListener("click", e => { const b = e.target.closest(".dia"); if (b) { dia = b.dataset.f; pintar(); } });
const mover = n => { const d = deISO(dia); d.setDate(d.getDate() + n); dia = fechaISO(d); pintar(); };
$("bAntes").addEventListener("click", () => mover(-1));
$("bDespues").addEventListener("click", () => mover(1));
$("bHoy").addEventListener("click", () => { dia = fechaISO(new Date()); pintar(); });
$("alerta").addEventListener("click", () => { dia = $("alerta").dataset.f; pintar(); });
setInterval(() => { if (!$("vCitas").classList.contains("hidden")) pintar(); }, 60000);   // mueve la línea de "ahora"
document.addEventListener("visibilitychange", () => { if (!document.hidden) { if (dia < fechaISO(new Date())) dia = fechaISO(new Date()); pintar(); } });

// ---------- Sesión ----------
if (configurado) onAuthStateChanged(auth, async user => {
  const ver = v => ["vLogin", "vCitas"].forEach(x => $(x).classList.toggle("hidden", x !== v));
  if (!user) return ver("vLogin");
  const ok = await getDoc(doc(db, "admins", user.uid)).then(s => s.exists()).catch(() => false);
  if (!ok) { await signOut(auth); ver("vLogin"); aviso("Esta cuenta no tiene acceso. Pide que la agreguen como admin."); return; }
  ver("vCitas");
  if (!window.__oyendo) { window.__oyendo = true; escuchar(); }
  pintar();
});
</script>
